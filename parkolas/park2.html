<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkolóbeosztás</title>
    <style>
        :root {
            --header-font-size: 10pt;
            --cell-font-size: 9.5pt;
            --place-font-size: 9.5pt;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;
            font-family: Arial, sans-serif;
            font-size: 9.5pt;
            margin: 0;
            padding: 5px;
            color: #000;
            width: 100%;
        }

        .table-wrap {
            width: 100%;
            max-width: 1050px;
            margin: 0 auto;
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            table-layout: fixed;
            width: 100%;
            border: 1px solid #000;
        }

        colgroup col:nth-child(1) { width: 9%; }
        colgroup col:nth-child(2) { width: 7.5%; }
        colgroup col:nth-child(3) { width: 15.5%; }
        colgroup col:nth-child(4) { width: 15.5%; }
        colgroup col:nth-child(5) { width: 15.5%; }
        colgroup col:nth-child(6) { width: 15.5%; }
        colgroup col:nth-child(7) { width: 15.5%; }
        colgroup col:nth-child(8) { width: 6%; }

        td.del, td.du, .fix-place, .fix, .napszak {
            font-weight: bold;
            text-align: center;
            vertical-align: middle;
            border: 1px solid #000;
            padding: 1px 2px;
            line-height: 1.1;
            word-break: break-word;
            overflow: hidden;
            height: 19px;
        }

        td.del, td.du { font-size: var(--cell-font-size); }
        .fix-place { font-size: var(--place-font-size); background: #f5f5f5; }
        .fix { font-size: var(--header-font-size); background: #e8e8e8; height: 22px; }
        .napszak { font-size: 9pt; background: #f0f0f0; }

        td.cell-green { background: #E2F0D9 !important; }
        td.cell-white { background: #FFFFFF !important; }
        td.cell-yellow { background: #FFF2CC !important; }

        .x24 { 
            border: none; 
            text-align: center; 
            vertical-align: middle; 
            padding: 0; 
            white-space: nowrap;
        }

        .toolbar {
            margin-top: 10px;
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .toolbar button {
            padding: 6px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: white;
            transition: 0.3s;
        }
        .btn-edit { background: #2196F3; }
        .btn-edit.active { background: #ff9800; }
        .btn-add { background: #9C27B0; display: none; }
        .btn-export { background: #27ae60; }
        .btn-export:hover { background: #1e8449; }
        .btn-import { background: #2980b9; }
        .btn-import:hover { background: #1a5276; }
        
        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 2px 4px;
            font-size: 11px;
            cursor: pointer;
            display: none;
        }

        .btn-insert-row {
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 11px;
            padding: 2px 4px;
            cursor: pointer;
            display: none;
        }

        body.edit-mode .btn-add,
        body.edit-mode .btn-delete,
        body.edit-mode .btn-insert-row { display: inline-block; }

        body.edit-mode td.fix-place {
            background: #f0f8ff !important;
            outline: 1px dashed #2196F3;
        }

        .status-msg {
            font-size: 13px;
            font-weight: bold;
            margin-left: 10px;
        }

        #fileInput { display: none; }

        /* JELSZÓ MODAL */
        .password-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            justify-content: center; align-items: center;
        }
        .password-overlay.active { display: flex; }
        .password-modal {
            background: white; padding: 30px 35px; border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center; max-width: 380px; width: 90%;
        }
        .password-modal h2 { font-size: 22px; color: #1a3c5e; margin-bottom: 6px; }
        .password-modal p { color: #666; font-size: 15px; margin-bottom: 16px; }
        .password-modal input {
            width: 100%; padding: 12px 14px; font-size: 20px; text-align: center;
            border: 2px solid #d0dbe8; border-radius: 6px; outline: none; transition: 0.2s; letter-spacing: 4px;
        }
        .password-modal input:focus { border-color: #1a3c5e; }
        .password-modal .modal-buttons { display: flex; gap: 10px; margin-top: 14px; justify-content: center; }
        .password-modal .modal-buttons button {
            padding: 10px 22px; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .password-modal .modal-buttons .confirm { background: #8d6c3f; color: white; }
        .password-modal .modal-buttons .confirm:hover { background: #6e522f; }
        .password-modal .modal-buttons .cancel { background: #ccc; color: #333; }
        .password-modal .modal-buttons .cancel:hover { background: #bbb; }
        .password-modal .error-msg { color: #d32f2f; font-size: 14px; margin-top: 8px; display: none; }
        .password-modal .error-msg.show { display: block; }

        @media print {
            @page {
                size: A4 landscape;
                margin: 3mm;
            }
            html, body {
                width: 100% !important;
                height: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
            }
            .toolbar, .btn-delete, .btn-insert-row, #statusMsg, .x24, .password-overlay {
                display: none !important;
            }
            colgroup col:nth-child(8) { width: 0% !important; }
            .table-wrap {
                max-width: 100% !important;
                width: 100% !important;
                overflow: visible !important;
            }
            table {
                width: 100% !important;
                table-layout: fixed !important;
                page-break-inside: avoid;
            }
            td.del, td.du, .fix-place, .fix, .napszak {
                font-size: 7.5pt !important;
                padding: 0.5px 1px !important;
                height: 15.5px !important;
                line-height: 1.05 !important;
            }
            .fix {
                height: 18px !important;
                font-size: 8.5pt !important;
            }
        }
    </style>
</head>
<body>

<div class="table-wrap">
    <table id="scheduleTable">
        <colgroup>
            <col><col><col><col><col><col><col><col>
        </colgroup>

        <tbody id="tableBody">
        <!-- A táblázat tartalma JavaScript-ből fog betöltődni -->
        </tbody>
    </table>
    
    <div class="toolbar">
        <button id="editBtn" class="btn-edit" onclick="toggleEdit()">🔒 Szerkesztés</button>
        <button class="btn-add" onclick="addNewPlace()">➕ Új hely hozzáadása</button>
        <button class="btn-export" onclick="exportData()">📤 Export</button>
        <button class="btn-import" onclick="importGombKattintas()">📥 Import</button>
        <input type="file" id="fileInput" accept=".json" onchange="importFajlKivalasztva(event)">
        <span id="statusMsg" class="status-msg"></span>
    </div>
</div>

<!-- JELSZÓ MODAL -->
<div class="password-overlay" id="passwordOverlay">
    <div class="password-modal">
        <h2>🔒 Jelszó szükséges</h2>
        <p id="jelszoUzenet">Add meg a jelszót a művelet folytatásához</p>
        <input type="password" id="jelszoInput" placeholder="●●●●" maxlength="4" autocomplete="off">
        <div class="error-msg" id="errorMsg">❌ Hibás jelszó! Próbáld újra.</div>
        <div class="modal-buttons">
            <button class="cancel" onclick="jelszoModalBezar()">Mégse</button>
            <button class="confirm" onclick="jelszoEllenorzes()">Jóváhagyás</button>
        </div>
    </div>
</div>

<script>
    // ===== KONFIGURÁCIÓ =====
    const STORAGE_KEY = 'parkolo_beosztas_data11';
    const JELSZO = '1111';
    const yellowNames = [
        "Főigazgató",
        "Gazdasági igazgató",
        "Céges autó",
        "Orvosigazgató"
    ];

    // ===== ALAPÉRTELMEZETT ADATOK - ÜRES =====
    const defaultData = [
        { place: "1. hely", schedule: [
            { time: "délelőtt", days: ["", "", "", "", ""] },
            { time: "délután", days: ["", "", "", "", ""] }
        ]}
    ];

    // ===== ADATKEZELÉS =====
    let parkoloData = [];
    let szerkesztesEngedelyezve = false;
    let varakozoMuvelet = null; // 'szerkesztes' vagy 'import'

    function getDefaultData() {
        return JSON.parse(JSON.stringify(defaultData));
    }

    function mentes() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(parkoloData));
        } catch(e) {
            console.error('Mentési hiba:', e);
        }
    }

    function betoltes() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const data = JSON.parse(raw);
                if (data && Array.isArray(data) && data.length > 0) {
                    parkoloData = data;
                    return true;
                }
            }
        } catch(e) {
            console.error('Betöltési hiba:', e);
        }
        return false;
    }

    // ===== TÁBLÁZAT MEGJELENÍTÉS =====
    function renderTable() {
        const tbody = document.getElementById('tableBody');
        if (!tbody) return;

        let html = '';
        
        // Fejléc
        html += `<tr>
            <td class="fix"></td>
            <td class="fix"></td>
            <td class="fix">HÉTFŐ</td>
            <td class="fix">KEDD</td>
            <td class="fix">SZERDA</td>
            <td class="fix">CSÜTÖRTÖK</td>
            <td class="fix">PÉNTEK</td>
            <td class="x24"></td>
        </tr>`;

        // Helyek
        if (parkoloData.length === 0) {
            // Ha nincs adat, létrehozunk egy alapértelmezett üres helyet
            parkoloData = getDefaultData();
        }
        
        parkoloData.forEach((place, index) => {
            const placeNumber = index + 1;
            let placeName = place.place || (placeNumber + ". hely");
            
            // Ha a hely név nem tartalmaz számot, akkor számozzuk át
            if (!/^\d+\./.test(placeName)) {
                placeName = placeNumber + ". hely";
            }
            
            // Délelőtt sor
            html += `<tr>
                <td rowspan="2" class="fix-place">${placeName}</td>
                <td class="napszak">délelőtt</td>`;
            
            for (let d = 0; d < 5; d++) {
                const value = place.schedule[0]?.days[d] || '';
                const colorClass = getColorClass(value);
                html += `<td class="del ${colorClass}" data-place="${index}" data-row="0" data-day="${d}">${value}</td>`;
            }
            
            html += `<td class="x24">
                <button class="btn-delete" onclick="deletePlace(${placeNumber})">🗑️</button>
                <button class="btn-insert-row" onclick="insertPlaceAfter(${placeNumber})">➕</button>
            </td></tr>`;

            // Délután sor
            html += `<tr>
                <td class="napszak">délután</td>`;
            
            for (let d = 0; d < 5; d++) {
                const value = place.schedule[1]?.days[d] || '';
                const colorClass = getColorClass(value);
                html += `<td class="du ${colorClass}" data-place="${index}" data-row="1" data-day="${d}">${value}</td>`;
            }
            
            html += `<td class="x24"></td></tr>`;
        });

        tbody.innerHTML = html;

        // Eseménykezelők hozzáadása
        if (szerkesztesEngedelyezve) {
            tbody.querySelectorAll('td.del, td.du').forEach(cell => {
                cell.setAttribute('contenteditable', 'true');
                cell.addEventListener('blur', function() {
                    const placeIdx = parseInt(this.dataset.place);
                    const row = parseInt(this.dataset.row);
                    const day = parseInt(this.dataset.day);
                    if (!isNaN(placeIdx) && !isNaN(row) && !isNaN(day)) {
                        if (parkoloData[placeIdx] && parkoloData[placeIdx].schedule[row]) {
                            parkoloData[placeIdx].schedule[row].days[day] = this.innerText.trim();
                            updateCellColor(this);
                            mentes();
                        }
                    }
                });
            });
            tbody.querySelectorAll('.fix-place').forEach(cell => {
                cell.setAttribute('contenteditable', 'true');
                cell.addEventListener('blur', function() {
                    const rows = tbody.querySelectorAll('tr');
                    let placeIdx = 0;
                    for (let i = 0; i < rows.length; i++) {
                        const cell = rows[i].cells[0];
                        if (cell && cell.classList.contains('fix-place') && cell.rowSpan === 2) {
                            if (placeIdx < parkoloData.length) {
                                parkoloData[placeIdx].place = cell.innerText.trim();
                            }
                            placeIdx++;
                        }
                    }
                    mentes();
                });
            });
        }

        updateEditMode();
    }

    function getColorClass(value) {
        if (!value || value.trim() === '') return 'cell-green';
        if (yellowNames.includes(value.trim())) return 'cell-yellow';
        return 'cell-white';
    }

    function updateCellColor(cell) {
        cell.classList.remove('cell-green', 'cell-white', 'cell-yellow');
        const text = cell.innerText.trim();
        if (text === '') {
            cell.classList.add('cell-green');
        } else if (yellowNames.includes(text)) {
            cell.classList.add('cell-yellow');
        } else {
            cell.classList.add('cell-white');
        }
    }

    function updateEditMode() {
        const body = document.body;
        const btn = document.getElementById('editBtn');
        const msg = document.getElementById('statusMsg');
        const editableCells = document.querySelectorAll('td.del, td.du');
        const placeCells = document.querySelectorAll('td.fix-place');

        if (szerkesztesEngedelyezve) {
            body.classList.add('edit-mode');
            btn.innerHTML = '✏️ Mentés és bezárás';
            btn.classList.add('active');
            msg.innerText = '✅ Szerkesztési mód aktív';
            msg.style.color = '#4CAF50';
            editableCells.forEach(cell => cell.setAttribute('contenteditable', 'true'));
            placeCells.forEach(cell => cell.setAttribute('contenteditable', 'true'));
        } else {
            body.classList.remove('edit-mode');
            btn.innerHTML = '🔒 Szerkesztés';
            btn.classList.remove('active');
            msg.innerText = '';
            editableCells.forEach(cell => cell.removeAttribute('contenteditable'));
            placeCells.forEach(cell => cell.removeAttribute('contenteditable'));
        }
    }

    // ===== JELSZÓ KEZELÉS =====
    function jelszoModalBezar() {
        document.getElementById('passwordOverlay').classList.remove('active');
        document.getElementById('jelszoInput').value = '';
        document.getElementById('errorMsg').classList.remove('show');
        varakozoMuvelet = null;
    }

    function jelszoEllenorzes() {
        const jelszo = document.getElementById('jelszoInput').value;
        
        if (jelszo === JELSZO) {
            document.getElementById('passwordOverlay').classList.remove('active');
            document.getElementById('jelszoInput').value = '';
            document.getElementById('errorMsg').classList.remove('show');
            
            if (varakozoMuvelet === 'szerkesztes') {
                szerkesztesEngedelyezve = true;
                renderTable();
                mentes();
                varakozoMuvelet = null;
            } else if (varakozoMuvelet === 'import') {
                // Megnyitjuk a fájlválasztót
                document.getElementById('fileInput').click();
                varakozoMuvelet = null;
            }
        } else {
            document.getElementById('errorMsg').classList.add('show');
            document.getElementById('jelszoInput').value = '';
            document.getElementById('jelszoInput').focus();
        }
    }

    // ===== SZERKESZTÉS KEZELÉS =====
    function toggleEdit() {
        if (szerkesztesEngedelyezve) {
            szerkesztesEngedelyezve = false;
            renderTable();
            mentes();
        } else {
            varakozoMuvelet = 'szerkesztes';
            document.getElementById('jelszoUzenet').innerText = 'Add meg a jelszót a szerkesztés megkezdéséhez';
            document.getElementById('passwordOverlay').classList.add('active');
            document.getElementById('jelszoInput').value = '';
            document.getElementById('errorMsg').classList.remove('show');
            document.getElementById('jelszoInput').focus();
        }
    }

    // ===== HELY KEZELÉS =====
    function addNewPlace() {
        if (!szerkesztesEngedelyezve) {
            alert('A hozzáadáshoz előbb kapcsold be a szerkesztési módot!');
            return;
        }
        
        const newNumber = parkoloData.length + 1;
        parkoloData.push({
            place: newNumber + '. hely',
            schedule: [
                { time: 'délelőtt', days: ['', '', '', '', ''] },
                { time: 'délután', days: ['', '', '', '', ''] }
            ]
        });
        renderTable();
        mentes();
    }

    function insertPlaceAfter(placeNumber) {
        if (!szerkesztesEngedelyezve) {
            alert('A beszúráshoz előbb kapcsold be a szerkesztési módot!');
            return;
        }
        
        const index = placeNumber - 1;
        if (index < 0 || index >= parkoloData.length) return;
        
        const newNumber = placeNumber + 1;
        parkoloData.splice(index + 1, 0, {
            place: newNumber + '. hely',
            schedule: [
                { time: 'délelőtt', days: ['', '', '', '', ''] },
                { time: 'délután', days: ['', '', '', '', ''] }
            ]
        });
        
        // Számozás frissítése
        for (let i = 0; i < parkoloData.length; i++) {
            const num = i + 1;
            const currentPlace = parkoloData[i].place;
            if (/^\d+\./.test(currentPlace)) {
                parkoloData[i].place = num + '. hely' + currentPlace.replace(/^\d+\./, '');
            }
        }
        
        renderTable();
        mentes();
    }

    function deletePlace(placeNumber) {
        if (!szerkesztesEngedelyezve) {
            alert('A törléshez előbb kapcsold be a szerkesztési módot!');
            return;
        }
        
        if (parkoloData.length <= 1) {
            alert('Nem törölheted az utolsó helyet!');
            return;
        }
        
        if (!confirm(`Biztosan törlöd a ${placeNumber}. helyet?`)) return;
        
        const index = placeNumber - 1;
        if (index < 0 || index >= parkoloData.length) return;
        
        parkoloData.splice(index, 1);
        
        // Számozás frissítése
        for (let i = 0; i < parkoloData.length; i++) {
            const num = i + 1;
            const currentPlace = parkoloData[i].place;
            if (/^\d+\./.test(currentPlace)) {
                parkoloData[i].place = num + '. hely' + currentPlace.replace(/^\d+\./, '');
            }
        }
        
        renderTable();
        mentes();
    }

    // ===== EXPORT =====
    function exportData() {
        const dataStr = JSON.stringify(parkoloData, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'parkolobeosztas.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        const msg = document.getElementById('statusMsg');
        msg.innerText = '✅ Export sikeres!';
        msg.style.color = '#4CAF50';
        setTimeout(() => { msg.innerText = ''; }, 3000);
    }

    // ===== IMPORT =====
    function importGombKattintas() {
        varakozoMuvelet = 'import';
        document.getElementById('jelszoUzenet').innerText = 'Add meg a jelszót az importáláshoz';
        document.getElementById('passwordOverlay').classList.add('active');
        document.getElementById('jelszoInput').value = '';
        document.getElementById('errorMsg').classList.remove('show');
        document.getElementById('jelszoInput').focus();
    }

    function importFajlKivalasztva(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data && Array.isArray(data) && data.length > 0) {
                    if (!confirm('Biztosan importálod az adatokat? A jelenlegi adatok felülíródnak!')) {
                        return;
                    }
                    parkoloData = data;
                    renderTable();
                    mentes();
                    
                    const msg = document.getElementById('statusMsg');
                    msg.innerText = '✅ Import sikeres!';
                    msg.style.color = '#4CAF50';
                    setTimeout(() => { msg.innerText = ''; }, 3000);
                } else {
                    alert('❌ Érvénytelen fájl!');
                }
            } catch(err) {
                alert('❌ Hiba történt: ' + err.message);
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    // ===== ESEMÉNYKEZELŐK =====
    document.getElementById('jelszoInput')?.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') jelszoEllenorzes();
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') jelszoModalBezar();
    });
    document.getElementById('passwordOverlay')?.addEventListener('click', function(e) {
        if (e.target === this) jelszoModalBezar();
    });

    // ===== INICIALIZÁLÁS =====
    function init() {
        if (!betoltes()) {
            parkoloData = getDefaultData();
            mentes();
        }
        renderTable();
    }

    document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
