<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📦 Repository index</title><style>body{margin:0;background:#111827;color:#f3f4f6;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:32px 20px}.path{color:#9ca3af;margin-bottom:20px}button,.item{font-size:16px;border:0;border-radius:10px;padding:12px 14px}button{background:#374151;color:white;cursor:pointer;margin:0 8px 18px 0}.list{display:grid;gap:8px}.item{display:block;background:#1f2937;color:#f3f4f6;text-decoration:none;cursor:pointer}.item:hover{background:#374151}.folder{font-weight:700}</style></head><body><div class="wrap"><h1>📦 Repository</h1><div id="path" class="path">/</div><button onclick="goHome()">🏠 Főkönyvtár</button><button id="back" onclick="goBack()">⬅️ Vissza</button><div id="list" class="list"></div></div><script>const tree=[{"name": "jelenletiiv", "type": "dir", "children": [{"name": "readme.html", "type": "file"}, {"name": "sample1.html", "type": "file"}]}, {"name": "parkolas", "type": "dir", "children": [{"name": "readme.html", "type": "file"}, {"name": "sample1.html", "type": "file"}]}, {"name": "rendelesek", "type": "dir", "children": [{"name": "readme.html", "type": "file"}, {"name": "sample1.html", "type": "file"}]}, {"name": "telefonkonyv", "type": "dir", "children": [{"name": "readme.html", "type": "file"}, {"name": "sample1.html", "type": "file"}]}, {"name": "readme.html", "type": "file"}];let current=[];function items(){let x=tree;for(const p of current)x=x.find(y=>y.name===p).children;return x}function render(){document.getElementById('path').textContent='/'+current.join('/')+(current.length?'/':'');document.getElementById('back').style.display=current.length?'inline-block':'none';let l=document.getElementById('list');l.innerHTML='';for(const i of items()){let e=document.createElement('a');e.className='item '+(i.type==='dir'?'folder':'');e.textContent=(i.type==='dir'?'📁 ':'📄 ')+i.name;if(i.type==='dir'){e.href='#';e.onclick=q=>{q.preventDefault();current.push(i.name);render()}}else{e.href=[...current,i.name].map(encodeURIComponent).join('/');e.target='_blank'}l.appendChild(e)}}function goHome(){current=[];render()}function goBack(){current.pop();render()}render();</script></body></html>
