<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendelési Idő</title>
    <style>
        :root {
            --header-font-size: 10pt;
            --cell-font-size: 10pt;
            --place-font-size: 10pt;
            --elvalaszto-szin: #EFFFE8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;
            font-family: Arial, sans-serif;
            font-size: 10pt;
            margin: 0;
            padding: 5px;
            color: #000;
            width: 100%;
        }

        .table-wrap {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            table-layout: fixed;
            width: 100%;
            border: 1px solid #000;
        }

        /* 12 oszlop: hely + 5 nap × (AM, PM) + jobb szél */
        colgroup col:nth-child(1) { width: 9%; }
        colgroup col:nth-child(2) { width: 8.2%; }
        colgroup col:nth-child(3) { width: 8.2%; }
        colgroup col:nth-child(4) { width: 8.2%; }
        colgroup col:nth-child(5) { width: 8.2%; }
        colgroup col:nth-child(6) { width: 8.2%; }
        colgroup col:nth-child(7) { width: 8.2%; }
        colgroup col:nth-child(8) { width: 8.2%; }
        colgroup col:nth-child(9) { width: 8.2%; }
        colgroup col:nth-child(10){ width: 8.2%; }
        colgroup col:nth-child(11){ width: 8.2%; }
        colgroup col:nth-child(12){ width: 4%; }

        td.fix-place, .fix, .fix-sub {
            font-weight: bold;
            text-align: center;
            vertical-align: middle;
            border: 1px solid #000;
            padding: 1px 2px;
            line-height: 1.15;
            word-break: break-word;
            overflow: hidden;
        }

        .fix-place { font-size: var(--place-font-size); background: #f5f5f5; height: 36px; }
        .fix { font-size: var(--header-font-size); background: #e8e8e8; height: 26px; }
        .fix-sub { font-size: 9pt; background: #f0f0f0; height: 24px; }

        td.cell-green { background: #E2F0D9 !important; }
        td.cell-white { background: #FFFFFF !important; }
        td.cell-yellow { background: #FFF2CC !important; }

        /* Ugyanaz a stílus, mint a fejléc AM/PM (fix-sub) */
        td.slot {
            text-align: center;
            vertical-align: middle;
            border: 1px solid #000;
            padding: 3px 2px;
            height: 36px;
            font-family: Arial, sans-serif;
            font-size: var(--cell-font-size);
            font-weight: bold;
            color: #000;
            line-height: 1.15;
            word-break: break-word;
            overflow: hidden;
        }

        body.edit-mode td.slot {
            outline: 1px dashed #2196F3;
        }

        .x24 { 
            border: none; 
            text-align: center; 
            vertical-align: middle; 
            padding: 0; 
            white-space: nowrap;
            background: var(--elvalaszto-szin);
        }

        .elvalaszto td {
            border: none !important;
            height: 8px !important;
            padding: 0 !important;
            background: var(--elvalaszto-szin) !important;
            line-height: 0;
            font-size: 0;
        }

        .toolbar {
            margin-top: 10px;
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .toolbar button {
            padding: 6px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: white;
            transition: 0.3s;
        }
        .btn-edit { background: #2196F3; }
        .btn-edit.active { background: #ff9800; }
        .btn-add { background: #9C27B0; display: none; }
        .btn-export { background: #27ae60; }
        .btn-export:hover { background: #1e8449; }
        .btn-import { background: #2980b9; }
        .btn-import:hover { background: #1a5276; }
        
        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 2px 4px;
            font-size: 11px;
            cursor: pointer;
            display: none;
        }

        .btn-insert-row {
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 11px;
            padding: 2px 4px;
            cursor: pointer;
            display: none;
        }

        body.edit-mode .btn-add,
        body.edit-mode .btn-delete,
        body.edit-mode .btn-insert-row { display: inline-block; }

        body.edit-mode td.fix-place {
            background: #f0f8ff !important;
            outline: 1px dashed #2196F3;
        }

        .status-msg {
            font-size: 13px;
            font-weight: bold;
            margin-left: 10px;
        }

        #fileInput { display: none; }

        .password-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            justify-content: center; align-items: center;
        }
        .password-overlay.active { display: flex; }
        .password-modal {
            background: white; padding: 30px 35px; border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center; max-width: 380px; width: 90%;
        }
        .password-modal h2 { font-size: 22px; color: #1a3c5e; margin-bottom: 6px; }
        .password-modal p { color: #666; font-size: 15px; margin-bottom: 16px; }
        .password-modal input {
            width: 100%; padding: 12px 14px; font-size: 20px; text-align: center;
            border: 2px solid #d0dbe8; border-radius: 6px; outline: none; transition: 0.2s; letter-spacing: 4px;
        }
        .password-modal input:focus { border-color: #1a3c5e; }
        .password-modal .modal-buttons { display: flex; gap: 10px; margin-top: 14px; justify-content: center; }
        .password-modal .modal-buttons button {
            padding: 10px 22px; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .password-modal .modal-buttons .confirm { background: #8d6c3f; color: white; }
        .password-modal .modal-buttons .confirm:hover { background: #6e522f; }
        .password-modal .modal-buttons .cancel { background: #ccc; color: #333; }
        .password-modal .modal-buttons .cancel:hover { background: #bbb; }
        .password-modal .error-msg { color: #d32f2f; font-size: 14px; margin-top: 8px; display: none; }
        .password-modal .error-msg.show { display: block; }

        @media print {
            @page {
                size: A4 landscape;
                margin: 10mm;
            }

            html, body {
                width: 100% !important;
                height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
            }

            .toolbar, .btn-delete, .btn-insert-row, #statusMsg, .password-overlay {
                display: none !important;
            }

            colgroup col:nth-child(12) { width: 2% !important; }

            .table-wrap {
                max-width: 100% !important;
                width: 100% !important;
                overflow: visible !important;
            }

            table {
                width: 98% !important;
                margin: 0 auto !important;
                table-layout: fixed !important;
                page-break-inside: auto !important;
                border: 1px solid #000 !important;
            }

            tr {
                page-break-inside: avoid !important;
                page-break-after: auto !important;
            }

            .elvalaszto {
                page-break-inside: avoid !important;
            }

            thead {
                display: table-header-group;
            }

            td.fix-place, .fix, .fix-sub, td.slot {
                font-size: 8.5pt !important;
                padding: 1px 1px !important;
                height: 22px !important;
                line-height: 1.15 !important;
                border: 1px solid #000 !important;
            }

            td.slot {
                font-family: Arial, sans-serif !important;
                font-weight: bold !important;
                color: #000 !important;
                font-size: 8.5pt !important;
            }

            .fix { height: 20px !important; font-size: 9pt !important; }
            .fix-sub { height: 18px !important; font-size: 7.5pt !important; }
            .fix-place { height: 22px !important; font-size: 9pt !important; }

            .elvalaszto td {
                height: 4px !important;
                background: var(--elvalaszto-szin) !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                border: none !important;
            }

            .x24 {
                display: table-cell !important;
                background: var(--elvalaszto-szin) !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                border-right: 1px solid #000 !important;
                border-bottom: 1px solid #000 !important;
                border-top: 1px solid #000 !important;
            }
        }
    </style>
</head>
<body>

<div class="table-wrap">
    <table id="scheduleTable">
        <colgroup>
            <col><col><col><col><col><col><col><col><col><col><col><col>
        </colgroup>

        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
    </table>
    
    <div class="toolbar">
        <button id="editBtn" class="btn-edit" onclick="toggleEdit()">🔒 Szerkesztés</button>
        <button class="btn-add" onclick="addNewPlace()">➕ Új hely hozzáadása</button>
        <button class="btn-export" onclick="exportData()">📤 Export</button>
        <button class="btn-import" onclick="importGombKattintas()">📥 Import</button>
        <input type="file" id="fileInput" accept=".json" onchange="importFajlKivalasztva(event)">
        <span id="statusMsg" class="status-msg"></span>
    </div>
</div>

<div class="password-overlay" id="passwordOverlay">
    <div class="password-modal">
        <h2>🔒 Jelszó szükséges</h2>
        <p id="jelszoUzenet">Add meg a jelszót a művelet folytatásához</p>
        <input type="password" id="jelszoInput" placeholder="●●●●" maxlength="4" autocomplete="off">
        <div class="error-msg" id="errorMsg">❌ Hibás jelszó! Próbáld újra.</div>
        <div class="modal-buttons">
            <button class="cancel" onclick="jelszoModalBezar()">Mégse</button>
            <button class="confirm" onclick="jelszoEllenorzes()">Jóváhagyás</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'rendelesi_ido_data44557785';
    const JELSZO = '1111';
    const yellowNames = ["Főigazgató", "Gazdasági igazgató", "Céges autó", "Orvosigazgató"];

    const NAPOK = ["Hétfő", "Kedd", "Szerda", "Csütörtök", "Péntek"];

    function getDefaultData() {
        const places = [];
        const names = [
            "1. hely", "2. hely", "3. hely", "4. hely", "5. hely",
            "6. hely (MK)", "7. hely", "8. hely (V)", "9. hely", "10. hely",
            "11. hely", "12. hely", "13. hely", "14. hely", "15. hely",
            "16. hely", "17. hely", "Gy", "18. hely", "19. hely",
            "20. hely", "21. hely"
        ];
        names.forEach(n => {
            places.push({
                place: n,
                days: [
                    { am: "", pm: "" },
                    { am: "", pm: "" },
                    { am: "", pm: "" },
                    { am: "", pm: "" },
                    { am: "", pm: "" }
                ]
            });
        });
        return places;
    }

    let parkoloData = [];
    let szerkesztesEngedelyezve = false;
    let varakozoMuvelet = null;

    function mentes() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(parkoloData)); }
        catch(e) { console.error('Mentési hiba:', e); }
    }

    function migrateOldData(data) {
        if (!Array.isArray(data) || data.length === 0) return null;

        if (data[0].days && Array.isArray(data[0].days) && typeof data[0].days[0] === 'object' && data[0].days[0] !== null && ('am' in data[0].days[0] || 'pm' in data[0].days[0])) {
            return data;
        }

        if (data[0].schedule && Array.isArray(data[0].schedule)) {
            return data.map(item => {
                const days = [];
                const am = item.schedule[0]?.days || [];
                const pm = item.schedule[1]?.days || [];
                for (let i = 0; i < 5; i++) {
                    days.push({
                        am: (am[i] || "").trim(),
                        pm: (pm[i] || "").trim()
                    });
                }
                return { place: item.place, days: days };
            });
        }

        if (data[0].days && Array.isArray(data[0].days) && typeof data[0].days[0] === 'string') {
            return data.map(item => {
                const days = [];
                for (let i = 0; i < 5; i++) {
                    const v = (item.days[i] || "").trim();
                    days.push({
                        am: (v === "AM" || v === "AM/PM") ? "AM" : "",
                        pm: (v === "PM" || v === "AM/PM") ? "PM" : ""
                    });
                }
                return { place: item.place, days: days };
            });
        }

        return null;
    }

    function betoltes() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const data = JSON.parse(raw);
                const migrated = migrateOldData(data);
                if (migrated && migrated.length > 0) {
                    parkoloData = migrated;
                    return true;
                }
            }
        } catch(e) { console.error('Betöltési hiba:', e); }
        return false;
    }

    function renderHeader() {
        const thead = document.getElementById('tableHead');
        if (!thead) return;
        let html = '<tr>';
        html += '<td class="fix" rowspan="2">Hely</td>';
        NAPOK.forEach(nap => {
            html += `<td class="fix" colspan="2">${nap.toUpperCase()}</td>`;
        });
        html += '<td class="x24" rowspan="2"></td>';
        html += '</tr><tr>';
        NAPOK.forEach(() => {
            html += '<td class="fix-sub">AM</td><td class="fix-sub">PM</td>';
        });
        html += '</tr>';
        html += '<tr class="elvalaszto"><td colspan="12"></td></tr>';
        thead.innerHTML = html;
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        if (!tbody) return;
        renderHeader();

        if (parkoloData.length === 0) parkoloData = getDefaultData();

        let html = '';
        parkoloData.forEach((place, index) => {
            const placeName = place.place || ((index + 1) + ". hely");
            const days = place.days || [];

            html += `<tr>
                <td class="fix-place">${placeName}</td>`;

            for (let d = 0; d < 5; d++) {
                const day = days[d] || { am: "", pm: "" };
                const amVal = day.am || "";
                const pmVal = day.pm || "";
                html += `<td class="slot ${getColorClass(amVal)}" data-place="${index}" data-day="${d}" data-slot="am">${amVal}</td>`;
                html += `<td class="slot ${getColorClass(pmVal)}" data-place="${index}" data-day="${d}" data-slot="pm">${pmVal}</td>`;
            }

            html += `<td class="x24">
                <button class="btn-delete" onclick="deletePlace(${index})">🗑️</button>
                <button class="btn-insert-row" onclick="insertPlaceAfter(${index})">➕</button>
            </td></tr>`;

            html += `<tr class="elvalaszto"><td colspan="12"></td></tr>`;
        });

        tbody.innerHTML = html;

        if (szerkesztesEngedelyezve) {
            tbody.querySelectorAll('td.slot').forEach(cell => {
                cell.setAttribute('contenteditable', 'true');
                cell.addEventListener('blur', function() {
                    const p = parseInt(this.dataset.place);
                    const d = parseInt(this.dataset.day);
                    const slot = this.dataset.slot;
                    if (!isNaN(p) && !isNaN(d) && slot && parkoloData[p]?.days?.[d]) {
                        parkoloData[p].days[d][slot] = this.innerText.trim();
                        updateCellColor(this);
                        mentes();
                    }
                });
                cell.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        this.blur();
                    }
                });
            });
            tbody.querySelectorAll('.fix-place').forEach(cell => {
                cell.setAttribute('contenteditable', 'true');
                cell.addEventListener('blur', function() {
                    const rows = tbody.querySelectorAll('tr');
                    let idx = 0;
                    rows.forEach(r => {
                        const c = r.cells[0];
                        if (c && c.classList.contains('fix-place')) {
                            if (idx < parkoloData.length) parkoloData[idx].place = c.innerText.trim();
                            idx++;
                        }
                    });
                    mentes();
                });
                cell.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        this.blur();
                    }
                });
            });
        }

        updateEditMode();
    }

    function getColorClass(value) {
        if (!value || value.trim() === '') return 'cell-green';
        if (yellowNames.includes(value.trim())) return 'cell-yellow';
        return 'cell-white';
    }

    function updateCellColor(cell) {
        cell.classList.remove('cell-green', 'cell-white', 'cell-yellow');
        const text = cell.innerText.trim();
        if (text === '') cell.classList.add('cell-green');
        else if (yellowNames.includes(text)) cell.classList.add('cell-yellow');
        else cell.classList.add('cell-white');
    }

    function updateEditMode() {
        const body = document.body;
        const btn = document.getElementById('editBtn');
        const msg = document.getElementById('statusMsg');
        const editableCells = document.querySelectorAll('td.slot');
        const placeCells = document.querySelectorAll('td.fix-place');

        if (szerkesztesEngedelyezve) {
            body.classList.add('edit-mode');
            btn.innerHTML = '✏️ Mentés és bezárás';
            btn.classList.add('active');
            msg.innerText = '✅ Szerkesztési mód aktív';
            msg.style.color = '#4CAF50';
            editableCells.forEach(c => c.setAttribute('contenteditable', 'true'));
            placeCells.forEach(c => c.setAttribute('contenteditable', 'true'));
        } else {
            body.classList.remove('edit-mode');
            btn.innerHTML = '🔒 Szerkesztés';
            btn.classList.remove('active');
            msg.innerText = '';
            editableCells.forEach(c => c.removeAttribute('contenteditable'));
            placeCells.forEach(c => c.removeAttribute('contenteditable'));
        }
    }

    function jelszoModalBezar() {
        document.getElementById('passwordOverlay').classList.remove('active');
        document.getElementById('jelszoInput').value = '';
        document.getElementById('errorMsg').classList.remove('show');
        varakozoMuvelet = null;
    }

    function jelszoEllenorzes() {
        const jelszo = document.getElementById('jelszoInput').value;
        if (jelszo === JELSZO) {
            document.getElementById('passwordOverlay').classList.remove('active');
            document.getElementById('jelszoInput').value = '';
            document.getElementById('errorMsg').classList.remove('show');
            if (varakozoMuvelet === 'szerkesztes') {
                szerkesztesEngedelyezve = true;
                renderTable();
                mentes();
                varakozoMuvelet = null;
            } else if (varakozoMuvelet === 'import') {
                document.getElementById('fileInput').click();
                varakozoMuvelet = null;
            }
        } else {
            document.getElementById('errorMsg').classList.add('show');
            document.getElementById('jelszoInput').value = '';
            document.getElementById('jelszoInput').focus();
        }
    }

    function toggleEdit() {
        if (szerkesztesEngedelyezve) {
            szerkesztesEngedelyezve = false;
            renderTable();
            mentes();
        } else {
            varakozoMuvelet = 'szerkesztes';
            document.getElementById('jelszoUzenet').innerText = 'Add meg a jelszót a szerkesztés megkezdéséhez';
            document.getElementById('passwordOverlay').classList.add('active');
            document.getElementById('jelszoInput').value = '';
            document.getElementById('errorMsg').classList.remove('show');
            document.getElementById('jelszoInput').focus();
        }
    }

    function addNewPlace() {
        if (!szerkesztesEngedelyezve) {
            alert('A hozzáadáshoz előbb kapcsold be a szerkesztési módot!');
            return;
        }
        const newNumber = parkoloData.length + 1;
        parkoloData.push({
            place: newNumber + '. hely',
            days: [
                { am: "", pm: "" },
                { am: "", pm: "" },
                { am: "", pm: "" },
                { am: "", pm: "" },
                { am: "", pm: "" }
            ]
        });
        renderTable();
        mentes();
    }

    function insertPlaceAfter(index) {
        if (!szerkesztesEngedelyezve) {
            alert('A beszúráshoz előbb kapcsold be a szerkesztési módot!');
            return;
        }
        if (index < 0 || index >= parkoloData.length) return;
        parkoloData.splice(index + 1, 0, {
            place: (index + 2) + '. hely',
            days: [
                { am: "", pm: "" },
                { am: "", pm: "" },
                { am: "", pm: "" },
                { am: "", pm: "" },
                { am: "", pm: "" }
            ]
        });
        renderTable();
        mentes();
    }

    function deletePlace(index) {
        if (!szerkesztesEngedelyezve) {
            alert('A törléshez előbb kapcsold be a szerkesztési módot!');
            return;
        }
        if (parkoloData.length <= 1) {
            alert('Nem törölheted az utolsó helyet!');
            return;
        }
        if (!confirm(`Biztosan törlöd a "${parkoloData[index].place}" helyet?`)) return;
        if (index < 0 || index >= parkoloData.length) return;
        parkoloData.splice(index, 1);
        renderTable();
        mentes();
    }

    function exportData() {
        const dataStr = JSON.stringify(parkoloData, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'rendelesi_ido.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        const msg = document.getElementById('statusMsg');
        msg.innerText = '✅ Export sikeres!';
        msg.style.color = '#4CAF50';
        setTimeout(() => { msg.innerText = ''; }, 3000);
    }

    function importGombKattintas() {
        varakozoMuvelet = 'import';
        document.getElementById('jelszoUzenet').innerText = 'Add meg a jelszót az importáláshoz';
        document.getElementById('passwordOverlay').classList.add('active');
        document.getElementById('jelszoInput').value = '';
        document.getElementById('errorMsg').classList.remove('show');
        document.getElementById('jelszoInput').focus();
    }

    function importFajlKivalasztva(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                const migrated = migrateOldData(data);
                if (migrated && migrated.length > 0) {
                    if (!confirm('Biztosan importálod az adatokat? A jelenlegi adatok felülíródnak!')) return;
                    parkoloData = migrated;
                    renderTable();
                    mentes();
                    const msg = document.getElementById('statusMsg');
                    msg.innerText = '✅ Import sikeres!';
                    msg.style.color = '#4CAF50';
                    setTimeout(() => { msg.innerText = ''; }, 3000);
                } else {
                    alert('❌ Érvénytelen fájl!');
                }
            } catch(err) {
                alert('❌ Hiba történt: ' + err.message);
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    document.getElementById('jelszoInput')?.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') jelszoEllenorzes();
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') jelszoModalBezar();
    });
    document.getElementById('passwordOverlay')?.addEventListener('click', function(e) {
        if (e.target === this) jelszoModalBezar();
    });

    function init() {
        if (!betoltes()) {
            parkoloData = getDefaultData();
            mentes();
        }
        renderTable();
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
